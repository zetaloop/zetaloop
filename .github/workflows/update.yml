name: Update

on:
  workflow_dispatch:
  schedule:
    - cron: '20 3 * * *'

concurrency: update

jobs:
  scoop:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Update manifests
        uses: ScoopInstaller/GithubActions@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SKIP_UPDATED: 1
          THROW_ERROR: 1
      - name: Set up uv
        uses: astral-sh/setup-uv@v10
        with:
          cache-dependency-glob: scripts/*.py
      - name: Cache font metadata
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/zetaloop-fonts.json
          key: fonts-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fonts-
      - name: Update fonts
        shell: pwsh
        run: |
          uv run scripts/update-fonts.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --quiet -- bucket Casks
          if ($LASTEXITCODE -eq 0) { exit }
          git add bucket Casks
          git commit -m "chore: update font packages"
          git push
      - name: Update VS Code registry data
        shell: pwsh
        run: |
          python scripts/update-vscode-registry.py
          git diff --quiet -- scripts/vscode-registry.json
          if ($LASTEXITCODE -eq 0) { exit }
          $version = (Get-Content bucket/vscode.json -Raw | ConvertFrom-Json).version
          git add scripts/vscode-registry.json
          git commit -m "vscode: Update registry data to version $version"
          git push

  homebrew:
    needs: scoop
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main
      - name: Update packages
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_GIT_NAME: github-actions[bot]
          HOMEBREW_GIT_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: scripts/update-homebrew

  nix:
    needs: homebrew
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
      - name: Set up Nix
        uses: cachix/install-nix-action@v31.11.1
      - name: Update packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          nix shell --inputs-from . nixpkgs#nix-update nixpkgs#nixfmt -c scripts/update-nix
          git diff --quiet -- flake.lock pkgs && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.lock pkgs
          git commit -m "chore: update Nix packages"
          git push
