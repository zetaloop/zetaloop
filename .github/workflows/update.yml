name: Update

on:
  workflow_dispatch:
  schedule:
    - cron: '20 3 * * *'

concurrency: update

jobs:
  scoop:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Update manifests
        uses: ScoopInstaller/GithubActions@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SKIP_UPDATED: 1
          THROW_ERROR: 1
      - name: Update VS Code registry data
        shell: pwsh
        run: |
          python scripts/update-vscode-registry.py
          git diff --quiet -- scripts/vscode-registry.json
          if ($LASTEXITCODE -eq 0) { exit }
          $version = (Get-Content bucket/vscode.json -Raw | ConvertFrom-Json).version
          git add scripts/vscode-registry.json
          git commit -m "vscode: Update registry data to version $version"
          git push

  homebrew:
    needs: scoop
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main
      - name: Update casks
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_GIT_NAME: github-actions[bot]
          HOMEBREW_GIT_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: scripts/update-casks
